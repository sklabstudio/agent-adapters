name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff mypy pyyaml build
      - name: Ruff
        shell: bash
        run: ruff check .
      - name: Mypy
        shell: bash
        run: mypy src
      - name: Pytest (fixture agents only, no paid calls)
        shell: bash
        run: pytest
        env:
          OPENAI_API_KEY: fake-ci-key
          ANTHROPIC_API_KEY: fake-ci-key
          GEMINI_API_KEY: fake-ci-key
          GITHUB_TOKEN: fake-ci-token
      - name: Build package
        shell: bash
        run: python -m build
      - name: Wheel smoke test
        shell: bash
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          sklab-agents --version
          sklab-agents list
          sklab-agents detect
          sklab-agents doctor
